<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col max-h-[90vh] overflow-hidden animate-fade-in-up border border-gray-100">
    
    <!-- header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-white">
      <div class="flex flex-col">
        <h2 class="text-xl font-bold text-gray-900 tracking-tight">
          Thêm kho mới
        </h2>
        <p class="text-sm text-gray-500 mt-0.5">
          Nhập thông tin chi tiết để tạo kho lưu trữ mới
        </p>
      </div>
      <button (click)="closeModal()" [disabled]="isSubmitting"
              class="text-gray-400 hover:text-gray-700 hover:bg-gray-100 p-2.5 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500/40 disabled:opacity-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- body -->
    <form [formGroup]="warehouseForm" (ngSubmit)="onSubmit()" class="flex flex-col flex-1 overflow-hidden">
      <div class="p-6 overflow-y-auto bg-gray-50/30 space-y-5">
        
        <!-- name -->
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700 mb-1.5">
            Tên kho <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input type="text" id="name" formControlName="name" placeholder="VD: Kho trung tâm Hà Nội"
                   class="w-full px-4 py-2.5 bg-white border rounded-xl text-sm outline-none transition-all shadow-sm"
                   [ngClass]="isFieldInvalid('name') ? 'border-red-400 focus:ring-4 focus:ring-red-500/10 focus:border-red-500' : 'border-gray-200 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500'">
          </div>
          @if (isFieldInvalid('name')) {
            <p class="text-xs text-red-500 mt-1.5 flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              Tên kho không được để trống.
            </p>
          }
        </div>

        <!-- address -->
        <div>
          <label for="address" class="block text-sm font-semibold text-gray-700 mb-1.5">
            Địa chỉ <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input type="text" id="address" formControlName="address" placeholder="VD: Số 1, Đường Lê Duẩn, Hà Nội"
                   class="w-full px-4 py-2.5 bg-white border rounded-xl text-sm outline-none transition-all shadow-sm"
                   [ngClass]="isFieldInvalid('address') ? 'border-red-400 focus:ring-4 focus:ring-red-500/10 focus:border-red-500' : 'border-gray-200 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500'">
          </div>
          @if (isFieldInvalid('address')) {
            <p class="text-xs text-red-500 mt-1.5 flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              Địa chỉ không được để trống.
            </p>
          }
        </div>

      </div>

      <!-- footer -->
      <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3 mt-auto">
        <button type="button" (click)="closeModal()" [disabled]="isSubmitting"
                class="px-5 py-2.5 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
          Hủy bỏ
        </button>
        
        <button type="submit" [disabled]="isSubmitting"
                class="px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-indigo-600 disabled:hover:shadow-md min-w-[120px] flex justify-center">
          <div class="flex items-center gap-2">
            @if (isSubmitting) {
              <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Đang lưu...</span>
            } @else {
              <span>Tạo kho mới</span>
            }
          </div>
        </button>
      </div>
    </form>
  </div>
</div>
