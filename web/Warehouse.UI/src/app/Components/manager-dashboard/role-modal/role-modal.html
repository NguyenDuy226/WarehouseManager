<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
    
    <!-- header -->
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
      <h3 class="text-lg font-bold text-gray-900">Phân quyền tài khoản</h3>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-md hover:bg-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <!--body  -->
    <div class="px-6 py-5 space-y-5">
      <!-- user infor-->
      <div class="bg-indigo-50/50 p-3.5 rounded-xl border border-indigo-50 flex items-center gap-3.5">
        <div class="h-11 w-11 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-lg uppercase shrink-0 shadow-sm">
          {{ user?.name?.charAt(0) || 'U' }}
        </div>
        <div class="flex flex-col min-w-0">
          <span class="text-sm font-bold text-gray-900 truncate">{{ user?.name }}</span>
          <span class="text-xs text-gray-500 truncate mt-0.5">@{{ user?.userName }}</span>
        </div>
      </div>

    <!--drop down list  -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Gán chức vụ mới <span class="text-rose-500">*</span></label>
        <div class="relative">
          <select [(ngModel)]="selectedRole" class="w-full bg-white border border-gray-200 rounded-xl pl-4 pr-10 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm font-medium text-gray-700 cursor-pointer appearance-none shadow-sm transition-all">
            <option *ngFor="let role of availableRoles" [value]="role.value">{{ role.label }}</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
        <p class="mt-2 text-xs text-gray-500 flex items-center gap-1.5">
          <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Tài khoản sẽ bị ghi đè chức vụ hiện tại.
        </p>
      </div>
    </div>

    <!-- footer -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex items-center justify-end gap-3 rounded-b-2xl">
      <button (click)="onClose()" [disabled]="isSavingRole" class="px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-gray-100 transition-colors shadow-sm">
        Hủy
      </button>
      <button (click)="submitRoleChange()" [disabled]="isSavingRole" class="flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm disabled:opacity-70 disabled:cursor-not-allowed">
        <svg *ngIf="isSavingRole" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span *ngIf="!isSavingRole">Xác nhận</span>
        <span *ngIf="isSavingRole">Đang lưu...</span>
      </button>
    </div>
  </div>
</div>
