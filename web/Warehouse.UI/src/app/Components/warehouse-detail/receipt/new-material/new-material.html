<div class="fixed inset-0 z-[60] flex items-center justify-center bg-gray-800/60 backdrop-blur-sm transition-opacity px-4 overflow-hidden">
  
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col animate-fadeInUp relative">
    <!-- header -->
    <div class="px-6 py-4 bg-emerald-50 border-b border-emerald-100 flex items-center justify-between rounded-t-xl">
      <h3 class="text-lg font-bold text-emerald-800 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        Thêm vật tư mới
      </h3>
      <button (click)="onClose()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full active:scale-95 transition-all focus:outline-none" title="Đóng">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- body -->
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Tên vật tư <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="materialData.name" placeholder="Ví dụ: Đinh vít 3 phân" 
               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-emerald-500 focus:border-emerald-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Danh mục</label>
          <select [(ngModel)]="materialData.categoryId" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-emerald-500 focus:border-emerald-500 text-sm">
            @for (cat of categories; track cat.id) { 
              <option [value]="cat.id">{{ cat.name }}</option> 
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Đơn vị tính</label>
          <select [(ngModel)]="materialData.unitOfMeasureId" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-emerald-500 focus:border-emerald-500 text-sm">
            @for (unit of units; track unit.id) { 
              <option [value]="unit.id">{{ unit.name }}</option> 
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Giá tham khảo (VNĐ)</label>
          <input type="number" min="0" step="any" [(ngModel)]="materialData.refPrice" 
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-emerald-500 focus:border-emerald-500 text-right text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Tồn tối thiểu</label>
          <input type="number" min="0" step="any" [(ngModel)]="materialData.mininumStock" 
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-emerald-500 focus:border-emerald-500 text-right text-sm">
        </div>
      </div>
      
      <p class="text-xs text-gray-500 italic mt-2">* Mã vật tư sẽ được hệ thống tự động sinh.</p>
    </div>

    <!-- footer -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end space-x-3 rounded-b-xl">
      <button (click)="onClose()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-semibold rounded hover:bg-gray-50 hover:-translate-y-0.5 hover:shadow-md active:scale-95 transition-all">
        Hủy bỏ
      </button>
      <button (click)="onSave()" class="px-4 py-2 bg-emerald-600 text-white text-sm font-semibold rounded shadow-sm hover:bg-emerald-700 hover:-translate-y-0.5 hover:shadow-md active:scale-95 transition-all">
        Lưu Vật Tư
      </button>
    </div>
  </div>
</div>

<style>
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .animate-fadeInUp {
    animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
