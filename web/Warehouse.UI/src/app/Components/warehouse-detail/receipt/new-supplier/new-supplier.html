<div class="fixed inset-0 z-[60] flex items-center justify-center bg-gray-800/60 backdrop-blur-sm transition-opacity px-4 overflow-hidden">
  
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col animate-fadeInUp relative">
    <!-- header -->
    <div class="px-6 py-4 bg-blue-50 bg-opacity-10 border-b border-blue-100 border-opacity-20 flex items-center justify-between rounded-t-xl">
      <h3 class="text-lg font-bold text-[#0088cc] flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        Thêm nhà cung cấp
      </h3>
      <button (click)="onClose()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full active:scale-95 transition-all focus:outline-none" title="Đóng">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <!-- body -->
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Tên nhà cung cấp <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="supplierData.name" placeholder="VD: Công ty TNHH Sắt thép Hòa Phát" 
               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-[#0088cc] focus:border-[#0088cc] text-sm">
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mã số thuế</label>
          <input type="text" [(ngModel)]="supplierData.taxCode" placeholder="VD: 0101234567" 
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-[#0088cc] focus:border-[#0088cc] text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Liên hệ (SĐT / Email)</label>
          <input type="text" [(ngModel)]="supplierData.contact" placeholder="VD: 0988... / abc@gmail.com" 
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-[#0088cc] focus:border-[#0088cc] text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Địa chỉ</label>
        <input type="text" [(ngModel)]="supplierData.addres" placeholder="VD: Quận 1, TP.HCM..." 
               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-[#0088cc] focus:border-[#0088cc] text-sm">
      </div>
      
      <p class="text-xs text-gray-500 italic mt-2">* Mã nhà cung cấp (Code) sẽ được hệ thống tự động sinh.</p>
    </div>
    <!-- footer -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end space-x-3 rounded-b-xl">
      <button (click)="onClose()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-semibold rounded hover:bg-gray-50 hover:-translate-y-0.5 hover:shadow-md active:scale-95 transition-all">
        Hủy bỏ
      </button>
      <button (click)="save()" [disabled]="isSubmitting" 
              class="px-4 py-2 bg-[#0088cc] text-white text-sm font-semibold rounded shadow-sm hover:bg-[#0077b3] hover:-translate-y-0.5 hover:shadow-md active:scale-95 transition-all disabled:opacity-50 disabled:hover:translate-y-0 disabled:hover:shadow-none flex items-center">
        <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        {{ isSubmitting ? 'Đang lưu...' : 'Lưu Nhà Cung Cấp' }}
      </button>
    </div>
  </div>
</div>

<style>
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .animate-fadeInUp {
    animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
