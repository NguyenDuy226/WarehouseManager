<div class="bg-[#f0f2f5] min-h-screen font-sans flex flex-col md:flex-row">
  <!-- side bar -->
  <div [class.w-64]="!isOpen"
       [class.w-16]="isOpen"
       class="hidden md:flex flex-col bg-[#1c2430] h-screen sticky top-0 shadow-lg z-40 transition-all duration-300 ease-in-out relative">
    <button (click)="changeSideBar()"
            class="absolute top-6 -right-3.5 bg-[#1c2430] border border-gray-600 rounded-full w-7 h-7 flex items-center justify-center text-gray-400 hover:text-white hover:border-gray-400 hover:shadow-md transition-all duration-300 z-50">
      <svg [class.rotate-180]="isOpen"
           class="w-4 h-4 transform transition-transform duration-300 ease-in-out"
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="flex items-center px-4 py-4 min-h-[64px] bg-[#151b23] border-b border-gray-800 transition-all duration-300"
         [class.justify-center]="isOpen">

      <div class="w-8 h-8 bg-[#0088cc] rounded flex items-center justify-center shrink-0 shadow-sm text-white font-bold text-lg">
        W
      </div>

      <span class="text-lg font-bold text-white tracking-wide truncate overflow-hidden transition-all duration-300 ease-in-out"
            [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[150px] opacity-100 ml-3'">
        Warehouse
      </span>
    </div>
    <div class="flex-1 py-4 overflow-y-auto overflow-x-hidden custom-scrollbar flex flex-col gap-1">
      <!-- user list -->
      @if (isAdminOrManager) {
        <a routerLink="/manager-dashboard/page/1"
           [ngClass]="checkActive('/manager-dashboard/page') ? 'bg-[#25303f] text-white border-[#0088cc]' : 'text-gray-400 border-transparent'"
           class="flex items-center px-4 py-3 border-l-4 hover:bg-[#25303f] hover:text-white transition-colors cursor-pointer"
           [class.justify-center]="isOpen">

          <svg class="w-5 h-5 shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>

          <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out text-[15px]"
                [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
            Nhân viên
          </span>
        </a>
      }
      <!-- warehouse list -->
      <a routerLink="/dashboard/page/1"
         [ngClass]="checkActive('/dashboard') ? 'bg-[#25303f] text-white border-[#0088cc]' : 'text-gray-400 border-transparent'"
         class="flex items-center px-4 py-3 border-l-4 hover:bg-[#25303f] hover:text-white transition-colors cursor-pointer"
         [class.justify-center]="isOpen">

        <svg class="w-5 h-5 shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>

        <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out text-[15px]"
              [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
          Kho bãi
        </span>
      </a>
      <!-- document -->
      <a routerLink="/documents/page/1"
         [ngClass]="checkActive('/documents/page') ? 'bg-[#25303f] text-white border-[#0088cc]' : 'text-gray-400 border-transparent'"
         class="flex items-center px-4 py-3 border-l-4 hover:bg-[#25303f] hover:text-white transition-colors cursor-pointer"
         [class.justify-center]="isOpen">

        <svg class="w-5 h-5 shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>

        <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out text-[15px]"
              [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
          Tài liệu
        </span>
      </a>
    </div>

    <div class="border-t border-gray-800 p-2 mt-auto overflow-hidden bg-[#151b23] flex flex-col gap-1">
      <!-- user profile -->
      <a [routerLink]="['/profile', userId]"
         title="Hồ sơ cá nhân"
         [ngClass]="checkActive('/profile') ? 'bg-[#25303f] text-white' : 'text-gray-300'"
         class="w-full flex items-center px-2 py-2.5 rounded-md hover:bg-[#25303f] hover:text-white transition-colors cursor-pointer"
         [class.justify-center]="isOpen">

        <div class="w-5 h-5 shrink-0 bg-gray-600 rounded-full flex items-center justify-center text-white overflow-hidden"
             [ngClass]="checkActive('/profile') ? 'bg-[#0088cc]' : ''">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>

        <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out text-left text-[14px] font-medium"
              [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
          {{ userName || 'Hồ sơ cá nhân' }}
        </span>
      </a>

      <!-- logout -->
      <button (click)="logOut()"
              title="Đăng xuất"
              class="w-full flex items-center px-2 py-2.5 rounded-md text-red-400 hover:bg-[#25303f] hover:text-red-300 transition-colors font-medium mt-1"
              [class.justify-center]="isOpen">

        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>

        <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out text-left text-[15px]"
              [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
          Đăng xuất
        </span>
      </button>
    </div>

  </div>

  <!-- nav bar -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] flex justify-between items-center h-16 px-2 sm:px-4 z-40">
    <!-- warehouse list -->
    <a routerLink="/dashboard/page/1"
       [ngClass]="checkActive('/dashboard') ? 'text-[#0088cc] font-medium' : 'text-gray-500'"
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 flex-1 hover:text-[#0088cc] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
      </svg>
      <span>Kho bãi</span>
    </a>
    <!-- user list -->
    @if (isAdminOrManager) {
      <a routerLink="/manager-dashboard/page/1"
         [ngClass]="checkActive('/manager-dashboard/page') ? 'text-[#0088cc] font-medium' : 'text-gray-500'"
         class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 flex-1 hover:text-[#0088cc] transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <span>Nhân viên</span>
      </a>
    }
    <!-- document -->
    <a routerLink="/documents/page/1"
       [ngClass]="checkActive('/documents/page') ? 'text-[#0088cc] font-medium' : 'text-gray-500'"
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 flex-1 hover:text-[#0088cc] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
      </svg>
      <span>Tài liệu</span>
    </a>
    <!-- profile -->
    <a [routerLink]="['profile/', userId]"
       [ngClass]="checkActive('/profile') ? 'text-[#0088cc] font-medium' : 'text-gray-500'"
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 flex-1 hover:text-[#0088cc] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
      <span>Cá nhân</span>
    </a>
    <!-- logout -->
    <button (click)="logOut()"
            class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 text-red-400 flex-1 hover:text-red-600 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span>Đăng xuất</span>
    </button>

  </div>

  <main class="flex-1 pb-20 md:pb-0 h-screen overflow-y-auto w-full">
    <router-outlet></router-outlet>
  </main>

</div>
