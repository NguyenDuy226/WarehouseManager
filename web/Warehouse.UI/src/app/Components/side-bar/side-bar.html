<!-- Bọc toàn bộ trang trong 1 container nền xám nhạt -->
<div class="bg-gray-100 min-h-screen font-sans flex flex-col md:flex-row">
  
    <!--side bar  -->
    <div [class.w-64]="!isOpen" [class.w-20]="isOpen"
       class="hidden md:flex flex-col bg-white h-screen sticky top-0 border-r border-gray-200 shadow-sm z-50 transition-all duration-300 ease-in-out relative">
    
    <!-- arrow-->
    <button (click)="changeSideBar()" 
            class="absolute top-8 -right-3.5 bg-white border border-gray-200 rounded-full w-7 h-7 flex items-center justify-center text-gray-500 hover:text-indigo-600 hover:border-indigo-300 hover:shadow-md transition-all duration-300 z-50">
        <svg [class.rotate-180]="isOpen" class="w-4 h-4 transform transition-transform duration-300 ease-in-out" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
        </svg>
    </button>

    <!-- logo-->
    <div class="flex items-center px-4 py-4 border-b border-b-gray-100 mb-4 min-h-[70px] transition-all duration-300" 
         [class.justify-center]="isOpen">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shrink-0 shadow-sm text-white font-bold text-xl">
            W
        </div>
        <span class="text-xl font-bold text-gray-800 tracking-wide truncate overflow-hidden transition-all duration-300 ease-in-out"
              [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[150px] opacity-100 ml-3'">
            Warehouse
        </span>
    </div>

    <!--nav -->
    <div class="flex-1 space-y-2 overflow-y-auto overflow-x-hidden px-3 custom-scrollbar">
       <!--only for admin and manager -->
       <!-- user -->
        @if (isAdminOrManager) {
        <a routerLink="/manager-dashboard/page/1" 
           routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
           title="Nhân viên"
           class="flex items-center px-3 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
           [class.justify-center]="isOpen">
            <svg class="w-6 h-6 shrink-0 transition-colors" [class.text-indigo-600]="checkActive('/manager-dashboard/page')" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out"
                  [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
                Nhân viên
            </span>
        </a>
        }
        <a routerLink="/dashboard/page/1" 
           routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
           title="Kho bãi"
           class="flex items-center px-3 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
           [class.justify-center]="isOpen">
            <svg class="w-6 h-6 shrink-0 transition-colors" [class.text-indigo-600]="checkActive('/dashboard')" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
            <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out"
                  [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
                Kho bãi
            </span>
        </a>
        <!-- transaction -->
        <a routerLink="/transactions" 
           routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
           title="Giao dịch"
           class="flex items-center px-3 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
           [class.justify-center]="isOpen">
            <svg class="w-6 h-6 shrink-0 transition-colors" [class.text-indigo-600]="checkActive('/transactions')" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
            </svg>
            <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out"
                  [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
                Giao dịch
            </span>
        </a>
    </div>

    <!-- logout -->
    <div class="border-t border-gray-100 p-3 mt-auto overflow-hidden">
        <button (click)="logOut()" 
                title="Đăng xuất"
                class="w-full flex items-center px-3 py-3 rounded-xl text-rose-500 hover:bg-rose-50 hover:text-rose-600 transition-colors font-medium"
                [class.justify-center]="isOpen">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            <span class="tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300 ease-in-out text-left"
                  [ngClass]="isOpen ? 'max-w-0 opacity-0 ml-0' : 'max-w-[200px] opacity-100 ml-3'">
                Đăng xuất
            </span>
        </button>
    </div>
  </div>

  <!-- nav bar -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] flex justify-between items-center h-16 px-2 sm:px-6 z-50">
    
    <a routerLink="/dashboard" routerLinkActive="text-indigo-600 font-medium" 
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 text-gray-500 flex-1 hover:text-indigo-500 transition-colors">
         <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"/>
        </svg>
        <span>Tổng quan</span>
    </a>

    <a routerLink="/users" routerLinkActive="text-indigo-600 font-medium" 
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 text-gray-500 flex-1 hover:text-indigo-500 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <span>Nhân viên</span>
    </a>

    <a routerLink="/warehouses" routerLinkActive="text-indigo-600 font-medium" 
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 text-gray-500 flex-1 hover:text-indigo-500 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span>Kho bãi</span>
    </a>

    <a routerLink="/transactions" routerLinkActive="text-indigo-600 font-medium" 
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 text-gray-500 flex-1 hover:text-indigo-500 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
      <span>Giao dịch</span>
    </a>

    <button (click)="logOut()" 
       class="flex flex-col items-center justify-center text-[10px] sm:text-xs gap-1 text-rose-500 flex-1 hover:text-rose-600 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span>Đăng xuất</span>
    </button>
  </div>

  <main class="flex-1 pb-20 md:pb-0 h-screen overflow-y-auto w-full">
    <router-outlet></router-outlet>
  </main>

</div>
